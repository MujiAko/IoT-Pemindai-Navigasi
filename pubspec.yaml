name: iot_pemindai_navigasi
description: "ESP32 Maps - navigation companion app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Peta & navigasi (data OpenStreetMap)
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  geolocator: ^14.0.0
  http: ^1.4.0

  # State & penyimpanan
  shared_preferences: ^2.5.3

  # Untuk tahap berikutnya (koneksi ESP32)
  # flutter_blue_plus: ^1.35.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true